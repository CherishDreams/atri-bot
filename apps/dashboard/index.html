<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>atri-bot 控制台</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-head">
          <strong>atri-bot</strong>
          <button id="new-session" title="新建会话">+</button>
        </div>
        <ul id="sessions"></ul>
      </aside>

      <main id="conversation">
        <div id="log"></div>
        <form id="composer">
          <input id="input" placeholder="输入消息…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </main>

      <section id="plugins-panel">
        <h2>插件</h2>
        <ul id="plugins"></ul>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
